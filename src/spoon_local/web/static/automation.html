<section class="dj-card" id="automation-panel" hidden>
<h2>방송 도우미 자동화</h2><p>시뮬레이션 전용 — 실제 SPOON 채팅으로 전송되지 않습니다.</p>
<form id="automation-form"><fieldset><legend>후원 감사</legend><label><input type="checkbox" id="auto-thanks"> 감사 메시지 ON</label><label>감사 템플릿 ({spoons}만 사용)<textarea id="auto-thanks-template" maxlength="400">소중한 {spoons}스푼 후원 감사합니다! 💛</textarea></label><label>쿨다운 (초)<input id="auto-cooldown" type="number" min="10" max="3600" value="10"></label><p id="auto-preview" role="status"></p></fieldset>
<fieldset><legend>방송 안내</legend><label><input type="checkbox" id="auto-announcement"> 안내 메시지 ON</label><label>안내 메시지<textarea id="auto-announcement-template" maxlength="400">방송에 와주셔서 감사합니다! 편하게 이야기 나눠요 💛</textarea></label><label>안내 간격 (초, 최소 60초)<input id="auto-interval" type="number" min="60" max="86400" value="900"></label></fieldset><button type="submit">설정 저장</button></form>
<button id="auto-begin" type="button">방송 자동화 시작</button><form id="auto-confirm" hidden><p id="auto-target"></p><label><input id="auto-consent" type="checkbox" required>표시된 가상 방송에서 저장된 기능을 Mock 실행하며 실제 SPOON에 전송되지 않음을 확인했어요.</label><button type="submit">확인하고 시작</button></form><div class="toolbar"><button id="auto-stop" type="button">자동화 전체 중지</button><button id="auto-clear" type="button">대기열 비우기</button><button id="auto-reset" type="button">설정 초기화</button><button id="auto-advance" type="button">가상 시간 +15분</button></div><p id="auto-status" role="status" aria-live="polite"></p><p id="auto-latest" role="status">최근 Mock 처리 없음</p><p id="auto-error" role="alert"></p><h3>Mock 전송 및 처리 기록 (최근 200건)</h3><div id="auto-records"></div></section>
